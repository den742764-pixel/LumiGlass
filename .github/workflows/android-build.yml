name: LumiGlass Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android components
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)""$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Download Telegram source
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/DrKLO/Telegram.git telegram-src

      - name: Build APK
        working-directory: telegram-src
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          chmod +x ./gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiGlass-debug
          path: |
            telegram-src/TMessagesProj_App/build/outputs/apk/**/*.apk
            telegram-src/TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
