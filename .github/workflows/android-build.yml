
name: LumiGlass Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out LumiGlass workflow
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Get Telegram Android source and submodules
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            https://github.com/DrKLO/Telegram.git telegram-src

      - name: Build debug APK
        working-directory: telegram-src
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiGlass-first-build-debug
          path: |
            telegram-src/TMessagesProj_App/build/outputs/apk/**/*.apk
            telegram-src/TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
